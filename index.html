<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор Электрика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Закон Ома</h2>
        <div class="form-group">
            <div class="radio-group">
                <label><input type="radio" name="mode" value="I" checked> Расчет Тока (I)</label>
                <label><input type="radio" name="mode" value="P"> Расчет Мощности (P)</label>
            </div>
            <input type="number" id="v1" placeholder="Значение 1 (Напряжение / Вт)">
            <input type="number" id="v2" placeholder="Значение 2 (Сопротивление / Ток)">
        </div>
        <div class="bottom-section">
            <button onclick="runOhm()">Рассчитать</button>
            <div id="res_ohm" class="result">Результат отобразится здесь</div>
        </div>
    </div>

    <div class="card">
        <h2>Расчет сечения кабеля</h2>
        <div class="form-group">
            <select id="mat">
                <option value="Медь">Медь</option>
                <option value="Алюминий">Алюминий</option>
            </select>
            <input type="number" id="p_wire" placeholder="Мощность нагрузки (кВт)">
        </div>
        <div class="bottom-section">
            <button onclick="runWire()">Рассчитать кабель</button>
            <div id="res_wire" class="result">Результат отобразится здесь</div>
        </div>
    </div>

    <div class="card">
        <h2>История расчетов</h2>
        <div class="history-list" id="historyLog">
        </div>
        <div class="bottom-section">
            <button class="btn-clear" onclick="clearHistory()">Очистить историю</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const saved = JSON.parse(localStorage.getItem("calc_history") || "[]");
        saved.forEach(item => addRecordToDOM(item.text, item.time));
    });

    function saveToHistory(text) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        addRecordToDOM(text, time);

        const saved = JSON.parse(localStorage.getItem("calc_history") || "[]");
        saved.unshift({ text, time }); // Добавляем в начало массива
        if (saved.length > 20) saved.pop(); // Ограничим историю 20 записями
        localStorage.setItem("calc_history", JSON.stringify(saved));
    }

    function addRecordToDOM(text, time) {
        const log = document.getElementById('historyLog');
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="time">${time}</div><div>${text.replace('\n', ' | ')}</div>`;
        log.insertBefore(item, log.firstChild); // Выводим новые записи сверху
    }

    function clearHistory() {
        localStorage.removeItem("calc_history");
        document.getElementById('historyLog').innerHTML = '';
    }

    function runOhm() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const v1 = document.getElementById('v1').value;
        const v2 = document.getElementById('v2').value;

        pywebview.api.py_calc_ohm(mode, v1, v2).then(response => {
            const el = document.getElementById('res_ohm');
            el.innerText = response.text;
            if (response.status === 'ok') {
                el.className = 'result success';
                saveToHistory(`Закон Ома: ${response.text}`);
            } else {
                el.className = 'result error';
            }
        });
    }

    function runWire() {
        const mat = document.getElementById('mat').value;
        const p = document.getElementById('p_wire').value;

        pywebview.api.py_calc_wire(p, mat).then(response => {
            const el = document.getElementById('res_wire');
            el.innerText = response.text;
            if (response.status === 'ok') {
                el.className = 'result success';
                saveToHistory(`Кабель (${mat}): ${response.text}`);
            } else {
                el.className = 'result error';
            }
        });
    }
</script>
</body>
</html>
